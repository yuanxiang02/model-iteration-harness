[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-iteration-harness"
version = "0.2.0"
description = "Local experiment runtime for Model Iteration Skills and existing training programs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/yuanxiang02/model-iteration-skills"

[project.scripts]
mih = "mih.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
